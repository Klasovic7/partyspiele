<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Partyspiele</title>

  <!-- Damit die Seite auf dem Handy als App gestartet werden kann -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#292526">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Partyspiele">
  <link rel="apple-touch-icon" href="bilder/apple-touch-icon.png">
  <link rel="icon" href="bilder/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800&family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stil.css">
</head>
<body>

  <div id="top-bar" hidden>
    <button id="btn-verlassen">Raum verlassen</button>
  </div>

  <p id="app-version"></p>
  <p id="debug-log" hidden></p>

  <!-- ---------- Start ---------- -->
  <div id="start-screen" class="bildschirm-karte">
    <div class="start-hero">
      <div class="start-icon">
        <img src="bilder/icon-192.png" width="72" height="72" alt="" class="app-icon">
      </div>
      <h1>Partyspiele</h1>
      <p class="start-tagline">Ein Raum, ein Abend, viele Spiele</p>
    </div>

    <label class="feld-label">Dein Name
      <input id="input-name" placeholder="z. B. Niklas" autocomplete="nickname">
    </label>

    <div class="start-aktionen">
      <button id="btn-erstellen" class="btn-primaer">Neuen Raum erstellen</button>
      <button id="btn-beitreten-oeffnen" class="btn-sekundaer">Raum beitreten</button>
    </div>

    <div class="start-deko" aria-hidden="true">
      <strong>Aus Freunden<br>werden Spieler</strong>
      <span>🎲</span><span>🎲</span>
    </div>

    <p id="start-error"></p>
  </div>

  <!-- ---------- Dialog: bestehendem Raum beitreten ---------- -->
  <div id="beitreten-dialog" class="beitreten-dialog" role="dialog" aria-modal="true"
       aria-labelledby="beitreten-titel" hidden>
    <form id="beitreten-form" class="beitreten-dialog-inhalt">
      <button id="btn-beitreten-schliessen" class="beitreten-schliessen" type="button" aria-label="Fenster schließen">×</button>
      <p class="kategorie">Bestehender Raum</p>
      <h2 id="beitreten-titel">Raum beitreten</h2>
      <p class="hinweis-text">Gib den vierstelligen Raum-Code ein.</p>
      <label class="feld-label" for="input-code">Raum-Code</label>
      <input id="input-code" placeholder="1234" maxlength="4" inputmode="numeric" pattern="[0-9]{4}"
             autocomplete="one-time-code" class="code-eingabe">
      <p id="beitreten-error" class="fehler-text" role="alert"></p>
      <button id="btn-beitreten" class="btn-primaer" type="submit">Raum beitreten</button>
    </form>
  </div>

  <!-- ---------- Vollbild-Auswahl: Farbe + Profilbild ---------- -->
  <div id="profil-screen" hidden>
    <div class="profil-zacken" aria-hidden="true"></div>
    <button id="btn-profil-verlassen" class="profil-verlassen" type="button">← Zurück ins Hauptmenü</button>

    <main class="profil-inhalt">
      <header class="profil-kopf">
        <h1>Wähle Farbe und Spieler</h1>
      </header>

      <section class="profil-auswahlblock" aria-label="Farbauswahl">
        <div class="profil-karussell">
          <button id="btn-farbe-zurueck" class="karussell-pfeil" type="button" aria-label="Vorherige Farbe">‹</button>
          <div id="farb-karussell" class="karussell-buehne farb-karussell" aria-live="polite"></div>
          <button id="btn-farbe-weiter" class="karussell-pfeil" type="button" aria-label="Nächste Farbe">›</button>
        </div>
      </section>

      <section class="profil-auswahlblock spieler-auswahlblock" aria-label="Spielerauswahl">
        <div class="profil-karussell">
          <button id="btn-icon-zurueck" class="karussell-pfeil" type="button" aria-label="Vorheriger Spieler">‹</button>
          <div id="icon-karussell" class="karussell-buehne icon-karussell" aria-live="polite"></div>
          <button id="btn-icon-weiter" class="karussell-pfeil" type="button" aria-label="Nächster Spieler">›</button>
        </div>
        <p class="profil-spielername">
          <span id="profil-vorname"></span>
          <strong id="profil-nachname"></strong>
        </p>
      </section>
    </main>

    <p id="avatar-hinweis" class="profil-hinweis" role="alert"></p>
    <button id="btn-profil-auswaehlen" class="profil-auswaehlen" type="button">Auswählen</button>
  </div>

  <!-- ---------- Lobby: wer spielt mit + Spielauswahl ---------- -->
  <div id="lobby-screen" class="bildschirm-karte" hidden>
    <h1>Warteraum</h1>
    <div class="lobby-code" aria-label="Raum-Code">
      <span>Raum-Code</span>
      <strong id="anzeige-code"></strong>
    </div>
    <p class="hinweis-text">Gib diesen Code deinen Freunden, damit sie beitreten können.</p>

    <h3>Mitspieler</h3>
    <ul id="spielerliste" class="lobby-spielerleiste"></ul>

    <h3>Spiel auswählen</h3>
    <p id="spielauswahl-hinweis" class="hinweis-text"></p>
    <div id="spiele-grid" class="spiele-grid"></div>
    <p id="lobby-fehler" class="fehler-text"></p>
  </div>

  <!-- ---------- Hierhin rendert das jeweils laufende Spiel ---------- -->
  <div id="spiel-wurzel"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
